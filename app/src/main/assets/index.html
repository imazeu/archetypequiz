<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Which Archetype Are You?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: cinematic and warm, like a film trailer for your personality
   IDEA: the reveal of a glowing badge in its own world, matching John's twelve scene artworks
   PICTURE: the twelve scene images; dimmed and drifting behind every screen, full and glowing at the reveal
   COLOUR and TYPE: night ground #0b0a12, warm cream text, gold glow accent, each archetype's own glow colour; Fredoka + Nunito (rounded)
   LAYOUT: one centred glass column over a full-bleed image backdrop; stacks naturally on a phone */
:root{color-scheme:dark;--bg:#0b0a12;--ink:#f6efe4;--soft:#c3b9cf;--glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.14);--gold:#ffc857;--glow:#ffc857}
*{box-sizing:border-box;min-width:0}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;font-weight:600;line-height:1.08;text-wrap:balance;margin:0}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden}
#bg img{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;opacity:0;transition:opacity 1.4s ease,filter .8s ease;animation:drift 24s ease-in-out infinite alternate}
#bg img.on{opacity:1}
@keyframes drift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.06) translate(-1.5%,-1%)}}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(11,10,18,.15),rgba(11,10,18,.8) 80%),linear-gradient(180deg,rgba(11,10,18,.1),rgba(11,10,18,.7))}
body.quiz #bg img{filter:blur(5px) brightness(.75)}
body.res #bg img{filter:blur(10px) brightness(.45)}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:clamp(22px,4vw,48px) max(5vw,16px) 40px}
.screen{display:none}.screen.on{display:block;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn{background:linear-gradient(180deg,#ffd987,#f5a524);color:#2a1700;font-family:Fredoka,sans-serif;font-weight:700;font-size:19px;padding:15px 36px;border-radius:999px;min-height:54px;box-shadow:0 0 28px rgba(255,200,87,.55),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .15s,box-shadow .15s}
.btn:hover{box-shadow:0 0 44px rgba(255,200,87,.8),inset 0 1px 0 rgba(255,255,255,.6)}
.btn:active{transform:scale(.97)}
.ghost{background:var(--glass);border:1px solid var(--edge);padding:13px 26px;border-radius:999px;font-weight:800;min-height:50px;backdrop-filter:blur(8px)}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:24px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
/* intro */
.intro{text-align:center}
.ring{position:relative;width:min(100%,420px);aspect-ratio:1;margin:0 auto 10px}
.ring .spin{position:absolute;inset:0;animation:spin 90s linear infinite}
.ring .orb{position:absolute;width:21%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;box-shadow:0 0 18px var(--c),0 6px 14px rgba(0,0,0,.5);animation:spin 90s linear infinite reverse}
.ring .orb img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes spin{to{rotate:360deg}}
.ring .mid{position:absolute;inset:28%;display:grid;place-content:center;text-align:center;border-radius:50%;background:radial-gradient(circle,rgba(255,200,87,.22),transparent 70%)}
.mid b{font-family:Fredoka;font-weight:700;font-size:clamp(52px,13vw,80px);line-height:1;color:var(--gold);text-shadow:0 0 26px rgba(255,200,87,.7)}
.mid span{font-weight:800;color:var(--soft);font-size:14px}
.hall{margin:4px 0 22px;--glow:#ff7a59}
.intro h1{font-size:clamp(34px,7vw,52px);margin:6px 0 10px;text-shadow:0 0 30px rgba(255,200,87,.35)}
.intro p{color:var(--soft);margin:0 auto 26px;max-width:30em}
.meta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px;color:var(--soft);font-size:14px;font-weight:700}
.meta span{background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:6px 14px;backdrop-filter:blur(8px)}
/* question */
.top{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.bar{flex:1;height:10px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f5a524,#ffd987);box-shadow:0 0 12px rgba(255,200,87,.8);border-radius:99px;transition:width .4s ease}
.count{font-weight:800;color:var(--soft);font-size:14px;white-space:nowrap}
.back{background:var(--glass);border:1px solid var(--edge);width:44px;height:44px;border-radius:50%;font-size:22px;line-height:1}
.back:disabled{opacity:.3;cursor:default}
.q h2{font-size:clamp(26px,5.5vw,36px);margin-bottom:24px;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.opts{display:grid;gap:12px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;background:rgba(20,17,32,.55);border:1px solid var(--edge);border-radius:22px;padding:14px 18px;min-height:66px;font-weight:700;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .2s,box-shadow .2s,transform .2s}
.opt:hover{border-color:var(--gold);box-shadow:0 0 20px rgba(255,200,87,.3);transform:translateX(3px)}
.opt.picked{border-color:var(--gold);background:rgba(255,200,87,.16);box-shadow:0 0 26px rgba(255,200,87,.45)}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-content:center;background:rgba(255,200,87,.15);color:var(--gold);font-family:Fredoka;font-weight:700;font-size:16px;border:1px solid rgba(255,200,87,.4)}
.opt small{display:block;font-weight:500;color:var(--soft);font-size:14px;line-height:1.35}
/* result */
.reveal{text-align:center}
.kicker{font-weight:800;color:var(--soft);margin-bottom:14px;letter-spacing:.02em}
.hero{border-radius:26px;overflow:hidden;position:relative;aspect-ratio:1408/768;box-shadow:0 0 0 1px rgba(255,255,255,.18),0 0 50px var(--glow),0 24px 50px -20px #000;animation:pop 1.1s cubic-bezier(.2,.9,.3,1.15)}
.hero img{width:100%;height:100%;object-fit:cover;display:block;animation:zoom 6s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.7);filter:brightness(3) blur(8px)}60%{opacity:1;filter:brightness(1.4) blur(0)}100%{transform:none;filter:none}}
@keyframes zoom{from{transform:scale(1.12)}to{transform:scale(1)}}
.name{margin-top:22px}
.name h2{font-size:clamp(44px,11vw,66px);font-weight:700;color:#fff;text-shadow:0 0 28px var(--glow),0 0 2px var(--glow)}
.name .tag{font-weight:800;font-size:18px;color:var(--soft);margin-top:6px}
.body{text-align:left;margin-top:24px;display:grid;gap:16px}
.body>p{margin:0;font-size:18px}
.panel{padding:18px 20px}
.panel h3{font-size:20px;margin-bottom:10px;color:var(--gold)}
.panel p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px;border:1px solid var(--glow);box-shadow:0 0 12px color-mix(in srgb,var(--glow) 40%,transparent);background:color-mix(in srgb,var(--glow) 16%,transparent)}
.runners{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.run{display:flex;gap:12px;align-items:center}
.run img{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 16px var(--c)}
.run b{font-family:Fredoka;font-size:18px;display:block}.run small{color:var(--soft);font-weight:700}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:7.2em minmax(0,1fr) 3em;gap:10px;align-items:center;font-size:14px;font-weight:800}
.row .t{height:9px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.row .t i{display:block;height:100%;border-radius:99px;width:0;transition:width 1.1s ease .4s}
.row .p{text-align:right;color:var(--soft)}
.acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.note{text-align:center;color:var(--soft);font-size:13px;margin-top:22px;opacity:.8}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div class="wrap">

<section class="screen on intro" id="s-intro">
  <div class="hero hall"><img src="img/H.jpg" alt="The 12 Archetypes: glowing shields lining a stone hall"></div>
  <h1>Which one are you?</h1>
  <p>Twelve classic characters live in every man. Answer honestly and find out which one leads the way in you.</p>
  <button class="btn" id="start">Start the quiz</button>
  <div class="meta"><span>20 questions</span><span>About 3 minutes</span><span>12 archetypes</span></div>
</section>

<section class="screen q" id="s-q">
  <div class="top">
    <button class="back" id="back" aria-label="Previous question">‹</button>
    <div class="bar"><i id="prog"></i></div>
    <span class="count" id="count"></span>
  </div>
  <h2 id="qtext"></h2>
  <div class="opts" id="opts"></div>
</section>

<section class="screen reveal" id="s-res">
  <div class="kicker">Your archetype is</div>
  <div class="hero" id="hero"></div>
  <div class="name" id="name"></div>
  <div class="body" id="resbody"></div>
  <div class="acts">
    <button class="btn" id="share">Share my result</button>
    <button class="ghost" id="again">Take it again</button>
  </div>
  <p class="note" id="copied" aria-live="polite"></p>
</section>

<p class="note">Just for fun, loosely inspired by Jungian archetypes. Not a validated personality test.</p>
</div>

<script>
{
const A={
P:{n:'Provider',c:'#e9822f',d:'#b85a14',t:'The one everyone leans on',x:'You measure a good life by how well your people are looked after. You show love through doing: fixing, earning, sorting, turning up. When something needs handling, you are already handling it.',s:['Dependable','Hard-working','Practical','Loyal'],w:'You can carry too much alone and forget that you need looking after too.'},
E:{n:'Emperor',c:'#d62839',d:'#951424',t:'Born to lead',x:'You see the big picture and you are comfortable owning it. People look to you when a decision needs making, and you would rather build the kingdom than live in someone else’s.',s:['Decisive','Ambitious','Commanding','Visionary'],w:'Control can tip into needing to control everything. Let others lead sometimes.'},
S:{n:'Strategist',c:'#2b59c3',d:'#183a8c',t:'Three moves ahead',x:'You read situations like a board game. While others react, you are mapping options, spotting angles and quietly picking the play that wins.',s:['Analytical','Calm','Clever','Patient'],w:'Overthinking can stall you. Sometimes the good-enough move now beats the perfect move later.'},
M:{n:'Mentor',c:'#22917f',d:'#12604f',t:'Lifts others higher',x:'Your best days are when someone else gets better because of you. You pass on what you know generously and you notice potential before people see it in themselves.',s:['Generous','Wise','Encouraging','Patient'],w:'Make sure you are still growing too, not only coaching from the sidelines.'},
F:{n:'Fighter',c:'#f26419',d:'#b23f00',t:'Never backs down',x:'Challenges light you up. You meet problems head-on, train hard, and keep going after others quit. Setbacks are just the next round.',s:['Courageous','Driven','Resilient','Disciplined'],w:'Not every battle is worth fighting. Pick the ones that matter.'},
R:{n:'Rebel',c:'#d4f000',d:'#2b1145',t:'Lives on his own terms',x:'You question everything and bow to nothing just because it is tradition. Freedom matters more than approval, and you would rather break a bad rule than live under it.',s:['Independent','Bold','Original','Honest'],w:'Fighting the system can become a habit. Rebel for something, not just against it.'},
G:{n:'Sage',c:'#6c4fd6',d:'#45309e',t:'Seeks the real answer',x:'You want to know how things truly work. You read, question and dig until you understand, and people trust you because you would rather be right than be quick.',s:['Knowledgeable','Thoughtful','Fair','Curious'],w:'Understanding is only half of it. Act on what you know.'},
X:{n:'Explorer',c:'#2fa35a',d:'#14552c',t:'Always over the next hill',x:'Routine feels like a cage to you. You are happiest discovering new places, ideas and experiences, and you trust yourself to find the way.',s:['Adventurous','Free','Self-reliant','Open-minded'],w:'Running towards the new can mean running from commitment. Some roots are worth it.'},
W:{n:'Magician',c:'#b0306a',d:'#4d1580',t:'Makes the impossible real',x:'You turn ideas into things. Where others see a problem, you see a system to build, a trick to pull off or a transformation waiting to happen.',s:['Inventive','Visionary','Resourceful','Transformative'],w:'Not every idea needs building at once. Finish the spell before starting the next.'},
T:{n:'Protector',c:'#0077b6',d:'#004b78',t:'Stands between you and harm',x:'You are the wall people shelter behind. You notice threats early, you step in without being asked, and nobody gets left behind on your watch.',s:['Brave','Loyal','Watchful','Steady'],w:'You cannot guard everyone from everything. Trust people to stand on their own sometimes.'},
L:{n:'Lover',c:'#e63972',d:'#a8174b',t:'Lives with his whole heart',x:'You feel deeply and love fully. Connection, beauty and passion are what make life worth living, and the people close to you feel truly seen.',s:['Passionate','Warm','Devoted','Charming'],w:'Do not lose yourself in other people. Your own needs count too.'},
J:{n:'Jester',c:'#f2a900',d:'#a87400',t:'Life is better with laughter',x:'You lighten every room. Humour is your superpower, and you use it to connect, defuse tension and remind everyone not to take life too seriously.',s:['Funny','Quick-witted','Playful','Disarming'],w:'Jokes can become a shield. Let people see the serious side now and then.'}
};
const Q=[
['You’ve got a completely free weekend. What do you actually do?',[['W','Build or tinker','A project, an app, a gadget'],['X','Go somewhere new','A road trip or a place you’ve never been'],['P','Sort the household','Jobs done, family squared away'],['J','Mates and banter','Pub, laughs, wind people up']]],
['A serious problem kicks off at work. Your instinct?',[['E','Take command','Step up and own it'],['S','Work the angles','Map the options, pick the best play'],['T','Shield the team','Take the heat so they don’t'],['F','Get stuck in','Hands on, tackle it head-on']]],
['What do people mostly come to you for?',[['M','Advice and guidance','Help me grow'],['G','Deep knowledge','You’ll know the real answer'],['J','A laugh','Lighten the mood'],['P','Getting it done','You’ll sort it']]],
['You’re handed a rule you think is stupid. You…',[['R','Ignore it','My call, my way'],['S','Work round it','Find the clever loophole'],['E','Change it','Go to the top and get it rewritten'],['G','Find out why first','Understand it before judging it']]],
['What drives you most?',[['X','Freedom','Nobody boxing me in'],['F','Winning','Beating the challenge'],['L','Connection','Passion and people'],['E','Legacy','Building something that lasts']]],
['Which compliment would land best?',[['W','“You made it happen”','Turned an idea into something real'],['T','“You’ve got my back”','Safe when you’re around'],['M','“You taught me loads”','Made me better'],['L','“You make life great”','Warmth and good times']]],
['In a film, which role are you?',[['G','The wise old hand','Seen it all, knows the score'],['R','The rogue outsider','Doesn’t play by their rules'],['L','The romantic lead','All heart'],['J','The comic relief','Steals every scene']]],
['What’s money really for?',[['P','Family security','Look after the people at home'],['X','Experiences','Travel and adventure'],['E','Building bigger','Grow the empire'],['L','Enjoying now','Life’s for living']]],
['Someone squares up to your mate. You…',[['F','Meet force with force','They picked the wrong night'],['J','Laugh it down','Defuse it with humour'],['S','Outthink them','Read it and play it smart'],['T','Step in between','Put yourself in front']]],
['What do you want to be remembered for?',[['W','Things I built','Creations that outlive me'],['M','People I lifted','Those I helped grow'],['G','Truth I uncovered','How things really work'],['R','Living my way','On my own terms']]],
['Pick a dream job title.',[['E','Founder and CEO','Running the show'],['W','Inventor','Making what doesn’t exist yet'],['M','Coach','Bringing out the best in others'],['T','First responder','First in when it goes wrong']]],
['At a party, where are you?',[['J','Holding court','Telling the stories'],['G','Deep chat in the corner','One good conversation'],['L','With your favourite person','Nobody else matters tonight'],['T','Making sure everyone gets home','Somebody has to']]],
['Which fear hits hardest?',[['P','Letting down people who rely on me','They count on me'],['E','Losing control','Of my life or my plans'],['X','Being stuck','Same place, same routine, forever'],['J','Being boring','Life without fun']]],
['Your ideal Sunday morning?',[['F','Training','Gym, run or the bag'],['G','Reading or a documentary','Learning something'],['P','Big breakfast for everyone','Feeding the troops'],['X','Wandering somewhere new','No plan, just go']]],
['In a team project you’re the one who…',[['S','Plans the moves','The roadmap is mine'],['F','Does the heavy lifting','Graft wins'],['J','Keeps morale up','Nobody sulks on my watch'],['R','Challenges groupthink','Somebody has to say it']]],
['Pick a superpower.',[['S','See the future','Know every outcome'],['W','Transform anything','Turn this into that'],['X','Teleport anywhere','Gone in a blink'],['T','An unbreakable shield','Nothing gets through']]],
['How do you show love?',[['P','Fixing and providing','Actions, not words'],['T','Keeping them safe','Always watching out'],['L','Words and romance','Saying it and showing it'],['M','Helping them grow','Backing their dreams']]],
['Under pressure, your weak spot is…',[['R','Going it alone','I don’t need permission'],['S','Overthinking','Paralysis by analysis'],['F','Pushing too hard','Never knowing when to stop'],['P','Taking on too much','Saying yes to everything']]],
['Your favourite kind of story?',[['F','The comeback fight','Underdog wins'],['L','A great romance','Love against the odds'],['R','A revolution','Tear down the old order'],['W','Hidden-world magic','Secrets and wonders']]],
['Pick your motto.',[['M','Leave it better than you found it',''],['T','Nobody gets left behind',''],['R','Rules are suggestions',''],['G','Know thyself','']]]
];
const KEYS=Object.keys(A);


const MAX={};KEYS.forEach(k=>MAX[k]=0);Q.forEach(q=>q[1].forEach(o=>MAX[o[0]]++));
const $=s=>document.querySelector(s);
const ORDER=['P','J','L','T','W','X','G','R','F','M','S','E'];const ALL=ORDER.concat('H');
const bg=$('#bg');
bg.innerHTML=ALL.map(k=>`<img src="img/${k}.jpg" alt="" data-k="${k}" loading="eager">`).join('');
const layers={};bg.querySelectorAll('img').forEach(i=>layers[i.dataset.k]=i);
let shown='';
function setBg(k){if(k===shown)return;if(layers[shown])layers[shown].classList.remove('on');layers[k].classList.add('on');shown=k}
let slide=0,timer=null;
function slideshow(on){clearInterval(timer);if(on){setBg(ORDER[slide%12]);timer=setInterval(()=>setBg(ORDER[++slide%12]),3800)}}
setBg('H');

let ans=[],cur=0,order=[];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function show(id,mode){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));document.body.className=mode||'';window.scrollTo(0,0)}
function start(){ans=[];cur=0;order=Q.map(q=>shuffle(q[1]));slideshow(false);show('s-q','quiz');renderQ()}
function renderQ(){
  const q=Q[cur];
  setBg(ORDER[(cur*5)%12]);
  $('#qtext').textContent=q[0];
  $('#count').textContent=(cur+1)+' / '+Q.length;
  $('#prog').style.width=(cur/Q.length*100)+'%';
  $('#back').disabled=cur===0;
  $('#opts').innerHTML=order[cur].map((o,i)=>`<button class="opt${ans[cur]===o[0]?' picked':''}" data-k="${o[0]}"><span class="k">${'ABCD'[i]}</span><span>${o[1]}${o[2]?`<small>${o[2]}</small>`:''}</span></button>`).join('');
  const s=$('#s-q');s.classList.remove('on');void s.offsetWidth;s.classList.add('on');
}
$('#opts').addEventListener('click',e=>{
  const b=e.target.closest('.opt');if(!b)return;
  ans[cur]=b.dataset.k;b.classList.add('picked');
  setTimeout(()=>{if(cur<Q.length-1){cur++;renderQ()}else result()},240);
});
$('#back').addEventListener('click',()=>{if(cur>0){cur--;renderQ()}});
$('#start').addEventListener('click',start);
$('#again').addEventListener('click',start);

let last='';
function result(){
  const sc={};KEYS.forEach(k=>sc[k]=0);ans.forEach(k=>sc[k]++);
  const pct=k=>Math.round(sc[k]/MAX[k]*100);
  const rank=KEYS.slice().sort((a,b)=>pct(b)-pct(a)||sc[b]-sc[a]);
  const k0=rank[0],top=A[k0];last=k0;
  document.documentElement.style.setProperty('--glow',top.c);
  setBg(k0);
  $('#hero').innerHTML=`<img src="img/${k0}.jpg" alt="The ${top.n} badge in its scene">`;
  $('#name').innerHTML=`<h2>The ${top.n}</h2><div class="tag">${top.t}</div>`;
  $('#resbody').innerHTML=`
    <p>${top.x}</p>
    <div class="panel glass"><h3>Your strengths</h3><div class="chips">${top.s.map(s=>`<span>${s}</span>`).join('')}</div></div>
    <div class="panel glass"><h3>Watch out for</h3><p>${top.w}</p></div>
    <div class="panel glass"><h3>Also strong in you</h3><div class="runners">${rank.slice(1,3).map(k=>`<div class="run" style="--c:${A[k].c}"><img src="img/${k}_t.jpg" alt=""><div><b>${A[k].n}</b><small>${pct(k)}% match</small></div></div>`).join('')}</div></div>
    <div class="panel glass"><h3>Your full breakdown</h3><div class="rows">${rank.map(k=>`<div class="row"><span>${A[k].n}</span><span class="t"><i data-w="${pct(k)}" style="background:${A[k].c};box-shadow:0 0 10px ${A[k].c}"></i></span><span class="p">${pct(k)}%</span></div>`).join('')}</div></div>`;
  $('#copied').textContent='';
  show('s-res','res');
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.row i').forEach(i=>i.style.width=i.dataset.w+'%')));
}
$('#share').addEventListener('click',async()=>{
  const a=A[last];const txt=`I'm The ${a.n}: ${a.t}. Which archetype are you? Take the 20-question quiz.`;
  if(window.Android){Android.share(txt);return}
  try{await navigator.clipboard.writeText(txt);$('#copied').textContent='Copied. Paste it anywhere with the quiz link.'}
  catch(e){$('#copied').textContent=txt}
});
}
</script>
</body>
</html>
