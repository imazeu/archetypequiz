plugins { id 'com.android.application' }
android {
    namespace 'uk.co.evengreen.archetypequiz'
    compileSdk 35
    defaultConfig {
        applicationId 'uk.co.evengreen.archetypequiz'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
